services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  server:
    build: ./server
    command: npm run dev
    working_dir: /app
    volumes: ["./:/app"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/ai-mystery-room
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:5173
    ports: ["5000:5000"]
    depends_on: [mongo]
  client:
    image: node:20-alpine
    command: sh -c "npm install && npm run dev -w client -- --host 0.0.0.0"
    working_dir: /app
    volumes: ["./:/app"]
    ports: ["5173:5173"]
    depends_on: [server]
volumes:
  mongo-data:
